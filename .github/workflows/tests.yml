name: Tests
on:
  #push:
  #  branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  tests:
    name: Run Tests
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install Dependencies
      run: npm ci
    - name: Install Playwright Browsers
      #run: npx playwright install --with-deps
      run: npx playwright install chromium
    - name: Run Playwright tests
      run: npx playwright test
    - name: Upload HTML Report
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.STORAGE_DEV_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_DEV_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: 'garage'
        AWS_ENDPOINT_URL: 'http://server.quizfreely.org:3900'
        FAILED: ${{ failure() }}
      run: |
        REPORT_DIR='idb-api-layer/tests/run-${{ github.run_id }}-${{ github.run_attempt }}'
        aws s3 cp playwright-report s3://dev/$REPORT_DIR/ --recursive
        if [[ "$FAILED" == "true" ]]; then
          echo "### ✅ Test Report" >> $GITHUB_STEP_SUMMARY
        else
          echo "### ❌ Test Report" >> $GITHUB_STEP_SUMMARY
        fi
        echo "View Test Report: https://dev.static.quizfreely.org/$REPORT_DIR/" >> $GITHUB_STEP_SUMMARY
