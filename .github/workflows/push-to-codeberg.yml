name: Push to Codeberg
on:
  workflow_dispatch:
jobs:
  push_to_codeberg:
    name: Push to Codeberg
    runs-on: ubuntu-latest
    steps:
      - name: Clone from GitHub
        run: git clone https://github.com/quizfreely/idb-api-layer.git
      - name: Push to Codeberg
        run: |
          cd idb-api-layer
          git push https://ehanahamed:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/quizfreely/idb-api-layer.git --all
